# XcodeGen spec. The .xcodeproj is generated in CI with `xcodegen generate`
# and is never committed.
name: Ricettario

options:
  bundleIdPrefix: com.garoth93
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.6"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  RicettarioCore:
    path: ../../packages/RicettarioCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"          # iPhone only
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Signing is empty here on purpose:
    # - testflight.yml overrides it on the command line (Automatic, team from
    #   the APPLE_TEAM_ID secret, profiles via the App Store Connect API key);
    # - build-ipa.yml (Sideloadly fallback) builds with CODE_SIGNING_ALLOWED=NO.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    PROVISIONING_PROFILE_SPECIFIER: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Ricettario:
    type: application
    platform: iOS
    # Tells Xcode's automatic signing which capabilities the App ID needs.
    attributes:
      SystemCapabilities:
        com.apple.BackgroundModes:
          enabled: 1
        com.apple.iCloud:
          enabled: 1
    sources:
      - path: Sources
      - path: Shared
      - path: Resources
    dependencies:
      - package: RicettarioCore
        product: RicettarioCore
      - sdk: UserNotifications.framework
      - sdk: BackgroundTasks.framework
      - sdk: PhotosUI.framework
      - sdk: AVFoundation.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.garoth93.ricettario
        PRODUCT_NAME: Ricettario
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Ricettario.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Info.plist   # generated by XcodeGen from the properties below (git-ignored)
      properties:
        CFBundleDisplayName: Ricettario
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: it
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Portrait only: App Store validation (error 90474) requires full screen.
        UIRequiresFullScreen: true
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        LSSupportsOpeningDocumentsInPlace: false
        UIFileSharingEnabled: false
        NSCameraUsageDescription: "Ricettario usa la fotocamera per scattare le foto delle ricette e dei passaggi."
        NSPhotoLibraryUsageDescription: "Ricettario aggiunge alle ricette e ai passaggi le foto che scegli."
        # Backups: shared iCloud container of all the apps, visible in Files as
        # iCloud Drive › Backup (each app writes in its own sub-folder).
        NSUbiquitousContainers:
          iCloud.com.garoth93.backup:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Backup
            NSUbiquitousContainerSupportedFolderLevels: Any
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.garoth93.ricettario.backup
        CFBundleURLTypes:
          - CFBundleURLName: com.garoth93.ricettario
            CFBundleURLSchemes:
              - ricettario
        # Shared recipes (.ricetta = JSON) open in the app from Files/Mail/Messages.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.garoth93.ricettario.recipe
            UTTypeDescription: Ricetta
            UTTypeConformsTo: [public.json, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [ricetta]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Ricetta
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [com.garoth93.ricettario.recipe]

schemes:
  Ricettario:
    build:
      targets:
        Ricettario: all
    run:
      config: Debug
    archive:
      config: Release
